exclude: '.git'
default_stages: [pre-commit]
fail_fast: false

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        files: "pypika.*"
        exclude: ".*json$|.*txt$|.*csv|.*md|.*svg"
      - id: check-yaml
      # `no-commit-to-branch` was configured for upstream's `master`. On this fork
      # every commit lands on `main`, so the hook fired on the default branch and
      # failed CI on every push. Its intent (protect the default branch locally) is a
      # pre-commit-stage concern; running it over `--all-files` in CI only ever blocks.
      - id: check-merge-conflict
      - id: check-ast
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: debug-statements

  - repo: https://github.com/psf/black
    rev: 25.9.0
    hooks:
      - id: black
