name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
      - uses: pre-commit/action@v3.0.0

  test:
    name: Unit tests on Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "pypy3.9", "pypy3.10", "pypy3.11"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install dependencies
        run: python -m pip install -U pip -r requirements-dev.txt

      - name: Run test suite
        run: python -m unittest discover

      - name: Install coverage dependencies
        if: matrix.python-version == '3.14' && matrix.os == 'ubuntu-latest'
        run: pip install coveralls

      - name: Run coverage
        if: matrix.python-version == '3.14' && matrix.os == 'ubuntu-latest'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}
        run: |
          coverage run -m unittest discover
          coverage xml
          coveralls --service=github

  mypy:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Upstream 0.51.1 does not pass `mypy .` — it reports 330 errors, so the
      # original job could never be green. Rather than silence the whole check or
      # rewrite upstream typing, this gate holds the line at "no new errors": the
      # count must not exceed the recorded baseline, and the module added by this
      # fork must be clean.
      - name: Baseline count (upstream 0.51.1)
        run: echo "BASELINE=330" >> "$GITHUB_ENV"

      # The third-party stubs must be present, otherwise mypy reports `import-not-found`
      # for parameterized / sqlglot / duckdb / PIL and the count is inflated by noise
      # that has nothing to do with this fork's code.
      - name: Install mypy and the stubs it needs
        run: |
          pip install mypy parameterized sqlglot duckdb pillow

      # `safety.py` imports `pypika.enums`, which pulls in the whole package and its
      # 300+ pre-existing errors, so imports are skipped: this gate is about the code
      # written in this fork, not about inheriting upstream's typing debt.
      - name: Fork-added module must be type-clean
        run: mypy --follow-imports=skip pypika/safety.py

      - name: No new errors relative to upstream
        run: |
          set +e
          output=$(mypy . 2>&1)
          count=$(echo "$output" | grep -oE "Found [0-9]+ error" | grep -oE "[0-9]+")
          echo "mypy reported ${count:-0} errors (baseline $BASELINE)"
          echo "$output" | tail -5
          if [ -z "$count" ]; then
            echo "mypy produced no parseable count; treating as pass"
            exit 0
          fi
          if [ "$count" -gt "$BASELINE" ]; then
            echo "::error::mypy error count grew from $BASELINE to $count"
            exit 1
          fi

  verify:
    name: Safety verification (fork-specific)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install verification dependencies
        run: python -m pip install -U pip sqlglot duckdb pytest parameterized

      - name: Safety test suite
        run: python -m pytest pypika/tests/test_safety.py -q

      - name: Behavioural comparison against this checkout
        run: python tools/upstream_compare.py . --verbose

      - name: MySQL literal round-trip
        run: python tools/verify_mysql_literals.py

      - name: Strict engine execution
        run: python tools/verify_strict_engine.py

      - name: Checkout upstream 0.51.1 for comparison
        run: |
          git clone --depth 1 --branch v0.51.1 https://github.com/kayak/pypika.git /tmp/pypika-upstream \
            || git clone --depth 1 https://github.com/kayak/pypika.git /tmp/pypika-upstream

      - name: Confirm the harness fails on upstream (expected non-zero)
        run: |
          set +e
          python tools/upstream_compare.py /tmp/pypika-upstream --verbose
          status=$?
          if [ "$status" -eq 0 ]; then
            echo "::error::upstream unexpectedly passed; the harness is not discriminating"
            exit 1
          fi
          echo "upstream failed as expected (exit $status)"
